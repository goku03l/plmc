# Local PostgreSQL for PLMC development.
# Published on host port 5433 to avoid clashing with a native Postgres on 5432.
services:
  db:
    image: postgres:18-alpine
    container_name: plmc-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: plmc
      POSTGRES_PASSWORD: plmc
      POSTGRES_DB: plmc
    ports:
      - "5433:5432"
    volumes:
      - plmc_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U plmc -d plmc"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  plmc_pgdata:
