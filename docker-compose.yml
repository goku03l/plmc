# Local PostgreSQL for Summer development.
# Published on host port 5433 to avoid clashing with a native Postgres on 5432.
services:
  db:
    image: postgres:18-alpine
    container_name: summer-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: summer
      POSTGRES_PASSWORD: summer
      POSTGRES_DB: summer
    ports:
      - "5433:5432"
    volumes:
      - summer_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U summer -d summer"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  summer_pgdata:
