# Render Blueprint for Summer: API (Fastify + Prisma), web (Vite static site), Postgres.
# Deploy: Render dashboard -> New -> Blueprint -> pick this repo.
# Services build from the repo root because this is an npm workspaces monorepo.

databases:
  - name: summer-db
    plan: basic-256mb # the free Postgres tier expires after 30 days
    region: singapore
    postgresMajorVersion: "16"

services:
  - type: web
    name: summer-api
    runtime: node
    region: singapore
    plan: starter # persistent disks need a paid plan
    buildCommand: npm ci && npm run build --workspace @summer/api
    # `start` runs `prisma migrate deploy` before booting the server
    startCommand: npm run start --workspace @summer/api
    healthCheckPath: /api/health
    disk:
      name: summer-uploads
      mountPath: /var/data
      sizeGB: 10
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: DATABASE_URL
        fromDatabase:
          name: summer-db
          property: connectionString
      - key: UPLOAD_DIR
        value: /var/data/uploads
      # Set these to the web site's public URL once it exists, e.g. https://summer-web.onrender.com
      - key: CORS_ORIGIN
        sync: false
      - key: APP_BASE_URL
        sync: false
      # AI assistant
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: DEEPSEEK_API_KEY
        sync: false
      # Voice (Google Cloud TTS / STT)
      - key: GOOGLE_TTS_API_KEY
        sync: false
      - key: GOOGLE_STT_API_KEY
        sync: false
      # Outgoing mail (RFQs); leave unset to only log messages
      - key: MAIL_FROM
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false

  - type: web
    name: summer-web
    runtime: static
    buildCommand: npm ci && npm run build --workspace @summer/web
    staticPublishPath: apps/web/dist
    envVars:
      - key: NODE_VERSION
        value: "22"
      # Public URL of summer-api, e.g. https://summer-api.onrender.com (no trailing /api).
      # Inlined by Vite at build time, so redeploy the web service after changing it.
      - key: VITE_API_URL
        sync: false
    routes:
      # SPA fallback for react-router
      - type: rewrite
        source: /*
        destination: /index.html
